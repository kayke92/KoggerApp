name: Build Carpcatcher Kogger Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - carpcatcher-kogger-*

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential libgl1-mesa-dev
          python3 -m pip install --user aqtinstall
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Qt 6.8.3 host tools
        run: |
          aqt install-qt linux desktop 6.8.3 linux_gcc_64 \
            --outputdir "$HOME/Qt" \
            -m qtmultimedia qtpositioning qtserialport

      - name: Install Qt 6.8.3 for Android ARM64
        run: |
          aqt install-qt linux android 6.8.3 android_arm64_v8a \
            --outputdir "$HOME/Qt" \
            -m qtmultimedia qtpositioning qtserialport

      - name: Use preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724"

      - name: Configure Android build
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.3.13750724"
          test -f "$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          sed -i 's/armeabi-v7a;arm64-v8a/arm64-v8a/' CMakeLists.txt
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/Qt/6.8.3/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$HOME/Qt/6.8.3/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK="$ANDROID_NDK_ROOT" \
            -DANDROID_PLATFORM=android-28 \
            -DQT_ANDROID_ABIS="arm64-v8a"

      - name: Build installable release APK
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.3.13750724"
          cmake --build build-android --target apk --parallel 2

      - name: Sign release APK
        run: |
          unsigned_apk="$(find build-android -type f -name '*release-unsigned.apk' -print -quit)"
          test -n "$unsigned_apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/carpcatcher-release.jks" -storepass android -keypass android -alias carpcatcher -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Carpcatcher Control"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$unsigned_apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/carpcatcher-release.jks" --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/Carpcatcher-Kogger-release.apk" "$RUNNER_TEMP/aligned.apk"

      - name: Verify and collect signed APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/Carpcatcher-Kogger-release.apk"
          rm -rf out-android
          mkdir -p out-android
          cp "$RUNNER_TEMP/Carpcatcher-Kogger-release.apk" out-android/Carpcatcher-Kogger-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Carpcatcher-Kogger-Android-APK
          path: out-android/*.apk
          if-no-files-found: error
          retention-days: 14
